spring:

  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        highlight_sql: true
    database: mysql

  messages:
    basename: messages/validation
    encoding: UTF-8
    fallbackToSystemLocale: false
    alwaysUseMessageFormat: true

  config:
    import: application-secret.yml
  data:
    redis:
      host: localhost
      port: 6379
management:
  endpoints:
    web:
      exposure:
        include: "*"
  server:
    port: 9292

server:
  tomcat:
    mbeanregistry:
      enabled: true
